   type WishlistAnalysis @model @auth(rules: [{ allow: public }]) {
     id: ID!
     wishlist_text: String!
     timestamp: AWSDateTime!
     analysis: String
     status: String
     activities: [Activity]
   }

  type Activity {
    name: String!
    city: String
    lat: Float
    lng: Float
    rating: Float
    user_ratings_total: Int
    formatted_address: String
    types: [String]  # Deprecated: Use primaryType instead
    primaryType: String
    place_id: String
    photo_reference: String
    is_recommended: Boolean
    # New enhanced fields
    display_name: String
    website_uri: String
    regular_opening_hours: OpeningHours
    reviews: [PlaceReview]
    editorial_summary: String
    primary_type_display_name: String
    international_phone_number: String
  }

   type WishlistAnalysisResult {
     wishlist_activities: [Activity]
   }


   type OpeningHours {
     open_now: Boolean
     periods: [OpeningPeriod]
     weekday_text: [String]
   }

   type OpeningPeriod {
     open: TimeOfDay
     close: TimeOfDay
   }

   type TimeOfDay {
     day: Int
     time: String
     date: String
     truncated: Boolean
   }

   type PlaceReview {
     author_name: String
     rating: Float
     text: String
     time: Int
     author_url: String
     profile_photo_url: String
   }

   type RouteLeg {
     distance: Int
     duration: String
     polyline: String
   }

   type RouteResult {
     polyline: String
     totalDistance: Int
     totalDuration: String
     travelMode: String
     legs: [RouteLeg]
   }

                   type CategoryItem {
  category: String!
  category_items: [String!]!
  emoji: String
}

 type RegionImageResult {
   city: String!
   photo_reference: String
 }

 type CityCategoriesResult {
   city: String!
   categories: [CategoryItem]
 }

 type CityPhotoResult {
   city: String!
   photo_reference: String
   categories: [CategoryItem]
 }

 type DeleteTripResult {
   success: Boolean!
   message: String!
   deletedTripID: String!
 }

 type UserProfile {
   userID: String!
   email: String!
   fullName: String!
 }

 type CategoryActivitiesResult {
   activities: [Activity!]!
   category: String!
 }

 type SearchSuggestionsResult {
   suggestions: [String!]!
 }

 type SearchActivitiesResult {
   activities: [Activity!]!
   query: String!
 }

 type Query {
   analyzeWishlist(wishlist_text: String!, selectedCity: String!): WishlistAnalysisResult @function(name: "wishlistAnalyzer-dev")
   getRoute(waypoints: [WaypointInput!]!): RouteResult @function(name: "GetRoute-dev")
   getRegionImage(selectedCity: String!): RegionImageResult @function(name: "regionImage-${env}")
   getCityCategories(selectedCity: String!): CityCategoriesResult @function(name: "CityCategories-${env}")
   getCityPhoto(selectedCity: String!): CityPhotoResult @function(name: "CityCategories-${env}")
   addAdditionalPlace(placeName: String!, selectedCity: String!): Activity @function(name: "getLocationCoordinates-${env}")
   generateCategoryActivities(selectedCity: String!, category: String!, existingCategoryActivities: [String!]): CategoryActivitiesResult @function(name: "generateCategoryActivities-${env}") @auth(rules: [{ allow: public }])
   searchAutocomplete(selectedCity: String!, query: String!, filters: [String!]): SearchSuggestionsResult @function(name: "searchAutocomplete-${env}") @auth(rules: [{ allow: public }])
   searchActivities(selectedCity: String!, searchQuery: String!, filters: [String!], existingCategoryActivities: [String!]): SearchActivitiesResult @function(name: "generateCategoryActivities-${env}") @auth(rules: [{ allow: public }])
   getTripIDs(userID: String!): [TripSummary] @function(name: "getTripIDs-${env}") @auth(rules: [{ allow: public }])
   getUserTrips(userID: String!, tripID: String!): Trip @function(name: "getUserTrips-${env}") @auth(rules: [{ allow: public }])
   searchUsers(searchTerm: String!): [UserProfile] @function(name: "searchUsers-${env}") @auth(rules: [{ allow: public }])
 }

   input WaypointInput {
     place_id: String!
     lat: Float!
     lng: Float!
   }

   type Collaborator {
     email: String!
     fullName: String!
     userID: String!
     role: CollaboratorRole!
     addedBy: String!
   }

   enum CollaboratorRole {
     owner
     editor
     viewer
   }

   type Trip {
     tripId: String!
     days: [Day!]!
     wishlist: [Activity!]!
     tripLength: Int
     selectedCity: String
     tripPhotoReference: String
     createdAt: String
     collaborators: [Collaborator!]!
   }

   type TripSummary {
     tripId: String!
     selectedCity: String
     tripPhotoReference: String
     createdAt: String
     tripLength: Int
     userRole: CollaboratorRole
   }

   type Day {
     dayNumber: Int!
     activities: [Activity!]!
     encodedPolyline: String
   }

   type Mutation {
     optimizeRoute(activities: [ActivityInput!]!): [Activity] @function(name: "OptimizeRoute-${env}") @auth(rules: [{ allow: public }])
     createTrip(input: CreateTripInput!): Trip @function(name: "CreateTripStorage-${env}") @auth(rules: [{ allow: public }])
     deleteTrip(userID: String!, tripID: String!): DeleteTripResult @function(name: "deleteTrip-${env}") @auth(rules: [{ allow: public }])
     addCollaborator(tripId: String!, userID: String!, userEmail: String!, fullName: String!, role: CollaboratorRole!, addedBy: String): Trip @function(name: "manageCollaborators-${env}") @auth(rules: [{ allow: public }])
     removeCollaborator(tripId: String!, userEmail: String!): Trip @function(name: "manageCollaborators-${env}") @auth(rules: [{ allow: public }])
     updateCollaboratorRole(tripId: String!, userEmail: String!, role: CollaboratorRole!): Trip @function(name: "manageCollaborators-${env}") @auth(rules: [{ allow: public }])
   }

   input ActivityInput {
     place_id: String!
     name: String!
     city: String
     lat: Float!
     lng: Float!
     rating: Float
     types: [String]  # Deprecated: Use primaryType instead
     primaryType: String
     photo_reference: String
     formatted_address: String
     user_ratings_total: Int
     is_recommended: Boolean
     # New enhanced fields
     display_name: String
     website_uri: String
     regular_opening_hours: OpeningHoursInput
     reviews: [PlaceReviewInput]
     editorial_summary: String
     primary_type_display_name: String
     international_phone_number: String
   }

   input DayInput {
     dayNumber: Int!
     activities: [ActivityInput!]!
     encodedPolyline: String
   }

   input CollaboratorInput {
     email: String!
     fullName: String!
     userID: String!
     role: CollaboratorRole!
     addedBy: String!
   }

   input CreateTripInput {
     tripId: String!
     userID: String!
     days: [DayInput!]!
     wishlist: [ActivityInput!]!
     tripLength: Int
     selectedCity: String
     tripPhotoReference: String
     createdAt: String
     collaborators: [CollaboratorInput!]!
   }


   input OpeningHoursInput {
     open_now: Boolean
     periods: [OpeningPeriodInput]
     weekday_text: [String]
   }

   input OpeningPeriodInput {
     open: TimeOfDayInput
     close: TimeOfDayInput
   }

   input TimeOfDayInput {
     day: Int
     time: String
     date: String
     truncated: Boolean
   }

   input PlaceReviewInput {
     author_name: String
     rating: Float
     text: String
     time: Int
     author_url: String
     profile_photo_url: String
   }