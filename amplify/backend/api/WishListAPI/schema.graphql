# ===== REAL-TIME COLLABORATION: Trip Operations (Event Sourcing) =====
# Operations are stored as lightweight events for conflict-free collaboration
# @model directive creates DynamoDB table + GraphQL mutations/queries automatically

type TripOperation
  @model
  @auth(rules: [{ allow: public }])
{
  id: ID!
  tripID: ID! @index(name: "byTripID", sortKeyFields: ["timestamp"], queryField: "listOperationsByTrip")
  timestamp: Float!
  opId: ID!
  userId: ID!
  sequenceNumber: Int!
  type: String!
  target: String!
  dayNumber: Int
  operationData: AWSJSON!
  ttl: Int # Unix timestamp for DynamoDB TTL (auto-delete after 1 hour)
}

# App Version Configuration
type AppVersionConfig {
  id: String!
  platform: String!
  minimumVersion: String!
  environment: String!
  lastUpdated: AWSDateTime
}

 type Query {
   analyzeWishlist(wishlist_text: String!, selectedCity: String!): WishlistAnalysisResult @function(name: "wishlistAnalyzer-dev")
   getRoute(waypoints: [WaypointInput!]!): RouteResult @function(name: "GetRoute-dev")
   getRegionImage(selectedCity: String!): RegionImageResult @function(name: "regionImage-${env}")
   getCityCategories(selectedCity: String!): CityCategoriesResult @function(name: "CityCategories-${env}")
   getCityPhoto(selectedCity: String!): CityPhotoResult @function(name: "CityCategories-${env}")
   addAdditionalPlace(placeName: String!, selectedCity: String!): Activity @function(name: "getLocationCoordinates-${env}")
   generateCategoryActivities(selectedCity: String!, category: String!, existingWishlistActivities: [String!]): CategoryActivitiesResult @function(name: "generateCategoryActivities-${env}") @auth(rules: [{ allow: public }])
   searchAutocomplete(selectedCity: String!, query: String!, filters: [String!]): SearchAutocompleteResponse @function(name: "searchAutocomplete-${env}") @auth(rules: [{ allow: public }])
   getPlaceDetails(place_id: String!, selectedCity: String!): GetPlaceDetailsResponse @function(name: "searchBarActivities-${env}") @auth(rules: [{ allow: public }])
   searchActivities(selectedCity: String!, searchQuery: String!, filters: [String!], existingWishlistActivities: [ActivityDeduplicationInput!]): SearchActivitiesResult @function(name: "searchBarActivities-${env}") @auth(rules: [{ allow: public }]) @deprecated(reason: "Use getPlaceDetails instead")
   getTripIDs(userID: String!): [TripSummary] @function(name: "getTripIDs-${env}") @auth(rules: [{ allow: public }])
   getUserTrips(userID: String!, tripID: String!): Trip @function(name: "getUserTrips-${env}") @auth(rules: [{ allow: public }])
   searchUsers(searchTerm: String!): [UserProfile] @function(name: "searchUsers-${env}") @auth(rules: [{ allow: public }])
   getUserProfile(username: String, userID: String): UserProfileStorage @function(name: "getUserProfile-${env}") @auth(rules: [{ allow: public }])
   getVersionConfig(platform: String!, environment: String!): AppVersionConfig @function(name: "getVersionConfig-${env}") @auth(rules: [{ allow: public }])
   getSavedPlaces(userID: String!, city: String): SavedPlacesResult @function(name: "getSavedPlaces-${env}") @auth(rules: [{ allow: public }])
   getPlacePhoto(placeId: String!, photoReference: String!, maxWidth: Int, forceRefresh: Boolean): PhotoResult @function(name: "getPlacePhoto-${env}") @auth(rules: [{ allow: public }])
 }

