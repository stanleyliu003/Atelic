   type WishlistAnalysis @model @auth(rules: [{ allow: public }]) {
     id: ID!
     wishlist_text: String!
     timestamp: AWSDateTime!
     analysis: String
     status: String
     activities: [Activity]
   }

   type Activity {
     name: String!
     city: String
     lat: Float
     lng: Float
     rating: Float
     user_ratings_total: Int
     formatted_address: String
     types: [String]
     place_id: String
     photo_reference: String
     is_recommended: Boolean
     # New enhanced fields
     display_name: String
     website_uri: String
     current_opening_hours: OpeningHours
     regular_opening_hours: OpeningHours
     reviews: [PlaceReview]
     editorial_summary: String
     primary_type_display_name: String
   }

   type WishlistAnalysisResult {
     wishlist_activities: [Activity]
   }


   type OpeningHours {
     open_now: Boolean
     periods: [OpeningPeriod]
     weekday_text: [String]
   }

   type OpeningPeriod {
     open: TimeOfDay
     close: TimeOfDay
   }

   type TimeOfDay {
     day: Int
     time: String
     date: String
     truncated: Boolean
   }

   type PlaceReview {
     author_name: String
     rating: Float
     text: String
     time: Int
     author_url: String
     profile_photo_url: String
   }

   type RouteLeg {
     distance: Int
     duration: String
     polyline: String
   }

   type RouteResult {
     polyline: String
     totalDistance: Int
     totalDuration: String
     legs: [RouteLeg]
   }

                   type CategoryItem {
  category: String!
  category_items: [String!]!
  emoji: String
}

 type RegionImageResult {
   city: String!
   photo_reference: String
 }

 type CityCategoriesResult {
   city: String!
   categories: [CategoryItem]
 }

 type CityPhotoResult {
   city: String!
   photo_reference: String
   categories: [CategoryItem]
 }

 type Query {
   analyzeWishlist(wishlist_text: String!, selectedCity: String!): WishlistAnalysisResult @function(name: "wishlistAnalyzer-dev")
   getRoute(waypoints: [WaypointInput!]!): RouteResult @function(name: "GetRoute-dev")
   getRegionImage(selectedCity: String!): RegionImageResult @function(name: "regionImage-${env}")
   getCityCategories(selectedCity: String!): CityCategoriesResult @function(name: "CityCategories-${env}")
   getCityPhoto(selectedCity: String!): CityPhotoResult @function(name: "CityCategories-${env}")
   addAdditionalPlace(placeName: String!, selectedCity: String!): Activity @function(name: "getLocationCoordinates-${env}")
 }

   input WaypointInput {
     place_id: String!
     lat: Float!
     lng: Float!
   }

   type Trip {
     tripId: String!
     days: [Day!]!
     wishlist: [Activity!]!
   }

   type Day {
     dayNumber: Int!
     activities: [Activity!]!
     encodedPolyline: String
   }

   type Mutation {
     optimizeRoute(activities: [ActivityInput!]!): [Activity] @function(name: "OptimizeRoute-${env}")
     createTrip(input: CreateTripInput!): Trip @function(name: "CreateTripStorage-${env}")
   }

   input ActivityInput {
     place_id: String!
     name: String!
     city: String
     lat: Float!
     lng: Float!
     rating: Float
     types: [String]
     photo_reference: String
     formatted_address: String
     user_ratings_total: Int
     is_recommended: Boolean
     # New enhanced fields
     display_name: String
     website_uri: String
     current_opening_hours: OpeningHoursInput
     regular_opening_hours: OpeningHoursInput
     reviews: [PlaceReviewInput]
     editorial_summary: String
     primary_type_display_name: String
   }

   input DayInput {
     dayNumber: Int!
     activities: [ActivityInput!]!
     encodedPolyline: String
   }

   input CreateTripInput {
     tripId: String!
     days: [DayInput!]!
     wishlist: [ActivityInput!]!
   }


   input OpeningHoursInput {
     open_now: Boolean
     periods: [OpeningPeriodInput]
     weekday_text: [String]
   }

   input OpeningPeriodInput {
     open: TimeOfDayInput
     close: TimeOfDayInput
   }

   input TimeOfDayInput {
     day: Int
     time: String
     date: String
     truncated: Boolean
   }

   input PlaceReviewInput {
     author_name: String
     rating: Float
     text: String
     time: Int
     author_url: String
     profile_photo_url: String
   }