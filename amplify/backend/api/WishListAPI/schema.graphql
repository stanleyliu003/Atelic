   type WishlistAnalysis @model @auth(rules: [{ allow: public }]) {
     id: ID!
     wishlist_text: String!
     timestamp: AWSDateTime!
     analysis: String
     status: String
     activities: [Activity]
   }

   type Activity {
     name: String!
     city: String
     lat: Float
     lng: Float
     rating: Float
     user_ratings_total: Int
     formatted_address: String
     types: [String]
     place_id: String
     photo_reference: String
     is_recommended: Boolean
   }

   type WishlistAnalysisResult {
     wishlist_activities: [Activity]
   }

   type RouteLeg {
     distance: Int
     duration: String
     polyline: String
   }

   type RouteResult {
     polyline: String
     totalDistance: Int
     totalDuration: String
     legs: [RouteLeg]
   }

   type Query {
     analyzeWishlist(wishlist_text: String!): WishlistAnalysisResult @function(name: "wishlistAnalyzer-dev")
     getRoute(waypoints: [WaypointInput!]!): RouteResult @function(name: "GetRoute-dev")
   }

   input WaypointInput {
     place_id: String!
     lat: Float!
     lng: Float!
   }

   type Trip {
     tripId: String!
     days: [Day!]!
     wishlist: [Activity!]!
   }

   type Day {
     dayNumber: Int!
     activities: [Activity!]!
     encodedPolyline: String
   }

   type Mutation {
     optimizeRoute(activities: [ActivityInput!]!): [Activity] @function(name: "OptimizeRoute-${env}")
     createTrip(input: CreateTripInput!): Trip @function(name: "CreateTripStorage-${env}")
   }

   input ActivityInput {
     place_id: String!
     name: String!
     city: String
     lat: Float!
     lng: Float!
     rating: Float
     types: [String]
     photo_reference: String
     formatted_address: String
     user_ratings_total: Int
     is_recommended: Boolean
   }

   input DayInput {
     dayNumber: Int!
     activities: [ActivityInput!]!
     encodedPolyline: String
   }

   input CreateTripInput {
     tripId: String!
     days: [DayInput!]!
     wishlist: [ActivityInput!]!
   }